name: main jdk17 build

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"

jobs:
  build:
    needs: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        java: ["17"]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}
          cache: "maven"
      - name: Install external tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl
      - name: Build with Maven
        id: maven-tests
        run: mvn -pl tika-core -am clean test -Dtest=BOMDetectorTest -Dsurefire.failIfNoSpecifiedTests=false -B

      - name: Vérifier les rapports de tests en échec
        id: test-results
        if: ${{ failure() && steps.maven-tests.outcome == 'failure' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          failed = False
          for path in glob.glob("**/target/surefire-reports/TEST-*.xml", recursive=True):
              root = ET.parse(path).getroot()
              if root.findall(".//failure") or root.findall(".//error"):
                  failed = True
                  print(f"Tests en échec dans {path}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"failed={str(failed).lower()}\n")
          PY

      - name: Rickroll après un test en échec
        if: ${{ failure() && steps.test-results.outputs.failed == 'true' }}
        uses: ./.github/actions/rickroll

  semgrep:
    name: Check for new vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: python -m pip install semgrep==1.185.0

      - name: Scan for new vulnerabilities
        env:
          BASELINE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git cat-file -e "${BASELINE_COMMIT}^{commit}"
          semgrep scan \
            --config p/security-audit \
            --baseline-commit "$BASELINE_COMMIT" \
            --error \
            --strict \
            --json \
            --output "$RUNNER_TEMP/semgrep-new.json"

      - name: Save Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-new-findings
          path: ${{ runner.temp }}/semgrep-new.json
          if-no-files-found: warn

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      matrix:
        java: ["17"]

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}
          cache: "maven"
      - name: Run E2E Tests
        id: e2e
        run: >-
          mvn -pl tika-e2e-tests/tika-server -am clean test -Pe2e
          "-Dtest=RunUatSmokeTest#testRickrollValidation"
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dgroups=E2ETest
          -Dmdep.skip=true
          -Dcheckstyle.consoleOutput=true
          -B
      - name: Vérifier les rapports E2E en échec
        id: e2e-results
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          reports = glob.glob("**/target/surefire-reports/TEST-*.xml", recursive=True)
          reports += glob.glob("**/target/failsafe-reports/TEST-*.xml", recursive=True)

          failed = False
          for path in reports:
              root = ET.parse(path).getroot()
              if root.findall(".//failure") or root.findall(".//error"):
                  failed = True
                  print(f"Tests en échec dans {path}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"failed={str(failed).lower()}\n")
          PY

      - name: Rickroll après un test E2E en échec
        if: ${{ failure() && steps.e2e-results.outputs.failed == 'true' }}
        uses: ./.github/actions/rickroll
